<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Anime Mining ā€” Demon Slayer Edition</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg-main:#1a0f0f;
  --bg-card:rgba(28,15,15,.85);
  --bg-card-2:rgba(45,23,23,.9);
  --accent-red:#c41e3a;
  --accent-gold:#ffb703;
  --accent-purple:#7b2cbf;
  --accent-green:#10b981;
  --text:#f8f8f8;
  --dim:#a8a8a8;
  --radius-xl:24px;
  --radius-lg:18px;
  --radius-md:14px;
  --transition:all .3s cubic-bezier(.4,0,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:system-ui,-apple-system,sans-serif;
  color:var(--text);
  min-height:100vh;
  background:linear-gradient(180deg,rgba(26,15,15,.8) 0%,rgba(10,5,20,.85) 100%),
    url("https://i.postimg.cc/0Q6j4B6x/1788760988257.jpg") center/cover no-repeat fixed;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;
  background:radial-gradient(circle at 20% 20%,rgba(196,30,58,.15),transparent 50%),
              radial-gradient(circle at 80% 80%,rgba(123,44,191,.1),transparent 50%);
  pointer-events:none;z-index:0
}
.app{position:relative;z-index:1;width:100%;max-width:430px;margin:0 auto;padding:14px;display:flex;flex-direction:column;min-height:100vh}

/* š” BotĆ³n de Sonido */
.sound-toggle{
  position:fixed;top:14px;right:14px;z-index:999;
  background:var(--bg-card-2);border:none;border-radius:50%;
  width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  font-size:22px;color:var(--text);cursor:pointer;backdrop-filter:blur(8px);
  box-shadow:0 2px 10px rgba(0,0,0,.3);
}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--bg-card-2);padding:14px 24px;border-radius:var(--radius-lg);z-index:9999;transition:transform .35s;font-weight:600;max-width:90%}
.toast.show{transform:translateX(-50%) translateY(0)}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.profile{display:flex;align-items:center;gap:10px;cursor:pointer}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--accent-red),var(--accent-purple));display:flex;align-items:center;justify-content:center;font-size:22px}
.user-info h4{font-size:14px;font-weight:600}
.user-info p{font-size:11px;color:var(--dim)}
.level-badge{background:linear-gradient(135deg,var(--accent-red),#9b1c2c);padding:6px 14px;border-radius:20px;font-size:13px;font-weight:700}
.balance-card{background:var(--bg-card);border-radius:var(--radius-xl);padding:22px 18px;text-align:center;margin-bottom:18px;backdrop-filter:blur(10px)}
.balance-card .label{font-size:12px;opacity:.75}
.amount{font-size:40px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0}
.amount .coin{font-size:32px}
.rate-line{display:flex;justify-content:space-around;gap:10px;margin-top:12px;flex-wrap:wrap}
.rate-item{font-size:12px;color:var(--dim)}
.rate-item span{color:var(--accent-gold);font-weight:600}
.energy-container{background:var(--bg-card);border-radius:var(--radius-lg);padding:14px;margin-bottom:12px;backdrop-filter:blur(8px)}
.energy-top{display:flex;justify-content:space-between;margin-bottom:8px;font-size:13px}
.energy-bar{height:10px;background:rgba(255,255,255,.08);border-radius:10px;overflow:hidden}
.energy-fill{height:100%;width:100%;background:linear-gradient(90deg,var(--accent-green),#4ade80);border-radius:10px;transition:width .3s ease}
.level-prog{background:var(--bg-card);border-radius:var(--radius-lg);padding:14px;margin-bottom:18px;backdrop-filter:blur(8px)}
.level-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}
.level-bar{height:8px;background:rgba(255,255,255,.08);border-radius:10px;overflow:hidden}
.level-fill{height:100%;width:5%;background:linear-gradient(90deg,var(--accent-red),var(--accent-gold));border-radius:10px;transition:width .5s ease}
.collect-wrap{display:flex;justify-content:center;margin:10px 0 28px;position:relative}
.collect-btn{width:200px;height:200px;border-radius:50%;border:none;background:radial-gradient(circle at 30% 30%,#3a1515,#2c0f0f);color:#fff;font-size:26px;font-weight:900;cursor:pointer;box-shadow:0 0 0 12px rgba(196,30,58,.12),0 0 70px rgba(196,30,58,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;animation:btnPulse 3s infinite ease-in-out}
.collect-btn:active{transform:scale(.93)}
.collect-btn .icon{font-size:48px}
.collect-btn .sub{font-size:12px;opacity:.7}
.collect-glow{position:absolute;inset:-15px;border-radius:50%;background:radial-gradient(circle,rgba(196,30,58,.3),transparent 70%);animation:pulse 2s infinite;pointer-events:none}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.1);opacity:.25}}
@keyframes btnPulse{0%,100%{box-shadow:0 0 0 12px rgba(196,30,58,.12),0 0 70px rgba(196,30,58,.4)}50%{box-shadow:0 0 0 15px rgba(196,30,58,.18),0 0 90px rgba(196,30,58,.5)}}
.collected-indicator{text-align:center;margin-bottom:18px;color:var(--dim);font-size:13px}
.collected-indicator span{color:var(--accent-gold);font-weight:700}
.nav-bar{display:flex;justify-content:space-around;background:var(--bg-card);border-radius:var(--radius-xl);padding:10px 6px;margin-top:auto;backdrop-filter:blur(10px)}
.nav-btn{background:none;border:none;color:var(--dim);font-size:11px;padding:8px 10px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.nav-btn .n-icon{font-size:20px}
.nav-btn.active{color:#fff;background:rgba(196,30,58,.25)}
.user-modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:999;display:none;align-items:center;justify-content:center;padding:20px}
.user-modal.active{display:flex}
.modal-content{background:var(--bg-card-2);border-radius:var(--radius-xl);padding:24px;width:100%;max-width:380px;animation:modalIn .3s ease-out}
@keyframes modalIn{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.close-btn{background:none;border:none;color:var(--dim);font-size:24px;cursor:pointer}
.stat-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.lang-buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
.lang-btn{background:var(--bg-card);border:1px solid rgba(255,255,255,.1);color:var(--text);padding:10px;border-radius:var(--radius-md);cursor:pointer}
.lang-btn.active{border-color:var(--accent-red);background:rgba(196,30,58,.2)}
.submenu-modal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:990;display:none;align-items:flex-end;justify-content:center}
  .submenu-modal.active{display:flex}
.submenu-content{background:linear-gradient(180deg,#251515,#1a0f0f);width:100%;max-width:450px;max-height:85vh;border-radius:28px 28px 0 0;padding:24px 20px 40px;overflow-y:auto;border-top:2px solid rgba(196,30,58,.3);animation:slideUp .35s ease-out}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.submenu-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.close-submenu{background:none;border:none;color:var(--dim);font-size:28px;cursor:pointer}

/* 🎭 Banner de Personajes con Animaciones */
.char-banner{display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.3);border-radius:var(--radius-lg);padding:12px;margin-bottom:18px;position:relative;overflow:hidden}
/* 🌫️ Nubes flotando */
.char-banner::before{content:"";position:absolute;top:0;left:-100%;width:200%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.05),transparent);animation:cloudsMove 8s linear infinite;pointer-events:none}
@keyframes cloudsMove{0%{transform:translateX(0)}100%{transform:translateX(50%)}}
/* 🔥 Fuego/luz parpadeante */
.char-banner::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at 30% 50%,rgba(255,80,0,.08),transparent 60%);animation:fireFlicker 2s ease-in-out infinite alternate;pointer-events:none}
@keyframes fireFlicker{0%{opacity:.4}100%{opacity:.9}}
/* 💨 Aire — leve movimiento de la imagen */
.char-avatar{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--accent-red),var(--accent-purple));display:flex;align-items:center;justify-content:center;font-size:26px;position:relative;z-index:1;overflow:hidden;animation:breath 4s ease-in-out infinite}
@keyframes breath{0%,100%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.03) rotate(1deg)}}
.char-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}

.tab-buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
.tab-btn{padding:10px;border-radius:var(--radius-md);border:none;background:var(--bg-card);color:var(--text);cursor:pointer;transition:var(--transition)}
.tab-btn.active{background:var(--accent-red)}
.tab-content{display:none}
.tab-content.active{display:block}
.item-card{background:rgba(0,0,0,.35);border-radius:var(--radius-md);padding:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.price-val{font-weight:700;font-size:15px;color:var(--accent-gold)}
.buy-btn{margin-top:6px;width:100%;border:none;padding:8px 12px;border-radius:10px;background:var(--accent-red);color:#fff;font-weight:600;cursor:pointer;transition:var(--transition)}
.buy-btn:active{transform:scale(.97)}
.convert-section{background:rgba(0,0,0,.35);border-radius:var(--radius-lg);padding:16px;margin-top:16px}
.convert-input{width:100%;background:rgba(255,255,255,.08);border:none;border-radius:10px;padding:12px;color:#fff;font-size:16px;margin:10px 0}
.convert-btn{width:100%;border:none;padding:14px;border-radius:var(--radius-md);background:linear-gradient(90deg,var(--accent-green),#0d9488);color:#fff;font-weight:700;cursor:pointer;margin-top:8px;transition:var(--transition)}
.convert-btn:active{transform:scale(.97)}
.referral-box{background:rgba(0,0,0,.35);border-radius:var(--radius-lg);padding:16px;margin-bottom:16px}
.referral-link{display:flex;gap:8px;margin-top:10px}
.ref-input{flex:1;background:rgba(255,255,255,.08);border:none;border-radius:10px;padding:10px;color:#fff}
.copy-btn{background:var(--accent-red);border:none;color:#fff;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:600;transition:var(--transition)}
.copy-btn:active{transform:scale(.95)}
.task-card{background:rgba(0,0,0,.35);border-radius:var(--radius-md);padding:14px;margin-bottom:12px}
.task-btn{background:var(--accent-purple);border:none;color:#fff;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:600;margin-top:10px;transition:var(--transition)}
.task-btn:active{transform:scale(.95)}
.wallet-address{background:rgba(255,255,255,.08);border-radius:10px;padding:12px;margin:10px 0;color:var(--dim);word-break:break-all}
</style>
</head>
<body>

<!-- 🔊 Botón de Control de Sonido -->
<button class="sound-toggle" id="soundToggle" onclick="toggleSound()">🔇</button>
<audio id="bgMusic" loop preload="auto" volume="0.15">
  <!-- 🎵 Música tenebrosa — puedes cambiar el enlace aquí -->
  <source src="https://assets.mixkit.co/sfx/preview/mixkit-deep-horror-drone-1550.mp3" type="audio/mpeg">


<div class="app">
  <div class="toast" id="toast"></div>

  <div class="user-modal" id="userModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>👤 Perfil de Usuario</h3>
        <button class="close-btn" onclick="closeUserModal()">×</button>
      </div>
      <div class="stat-row"><span>Usuario</span><span id="modal-username">—</span></div>
      <div class="stat-row"><span>Nivel</span><span id="modal-level">Nv. 1</span></div>
      <div class="stat-row"><span>VIP</span><span id="modal-vip">❌ No</span></div>
      <div class="stat-row"><span>Total Minado</span><span id="modal-total">0 ANIM</span></div>
      <div class="lang-buttons">
        <button class="lang-btn active" data-lang="es">🇪🇸 Español</button>
        <button class="lang-btn" data-lang="en">🇬🇧 English</button>
        <button class="lang-btn" data-lang="ru">🇷🇺 Русский</button>
        <button class="lang-btn" data-lang="pt">🇧🇷 Português</button>
      </div>
    </div>
  </div>

  <div class="header">
    <div class="profile" onclick="openUserModal()">
      <div class="avatar" id="avatar">⚡</div>
      <div class="user-info">
        <h4 id="username">Minero Anime</h4>
        <p><span id="user-rank">Explorador</span></p>
      </div>
    </div>
    <div class="level-badge" id="user-level">Nv. 1</div>
  </div>

  <div class="balance-card">
    <p class="label">💰 Balance Total</p>
    <div class="amount"><span class="coin">🪙</span><span id="token-count">0.000</span> ANIM</div>
    <div class="rate-line">
      <div class="rate-item">⚡ Velocidad: <span id="mine-rate">0.001</span>/seg</div>
      <div class="rate-item">🔥 Acumulado: <span id="pending-amount">0</span></div>
    </div>
  </div>

  <div class="energy-container">
    <div class="energy-top"><strong>⚡ Energía</strong> <span id="energy-text">100 / 100</span></div>
    <div class="energy-bar"><div class="energy-fill" id="energy-bar"></div></div>
      </div>

  <div class="level-prog">
    <div class="level-top"><strong>📈 Progreso de Nivel</strong> <span id="level-text">0 / 100 XP</span></div>
    <div class="level-bar"><div class="level-fill" id="level-bar"></div></div>
  </div>

  <div class="collected-indicator">
    Acumulado para recolección: <span id="accumulated-display">0.000 ANIM</span>
  </div>

  <div class="collect-wrap">
    <div class="collect-glow"></div>
    <button class="collect-btn" id="collect-button">
      <span class="icon">⛩️</span>
      RECOLECTAR
      <span class="sub">Toca para recibir</span>
    </button>
  </div>

    <div class="nav-bar">
    <button class="nav-btn active" data-tab="mine"><span class="n-icon">⛏️</span>Minar</button>
    <button class="nav-btn" data-tab="upgrades"><span class="n-icon">⚡</span>Mejoras</button>
    <button class="nav-btn" data-tab="friends"><span class="n-icon">👥</span>Amigos</button>
    <button class="nav-btn" data-tab="wallet"><span class="n-icon">💼</span>Billetera</button>
    <button class="nav-btn" data-tab="rewards"><span class="n-icon">🎁</span>Recompensas</button>
  </div>

  <!-- ⚡ MEJORAS — Muzan -->
  <div class="submenu-modal" id="submenu-upgrades">
    <div class="submenu-content">
      <div class="submenu-header">
        <h2>⚡ Mejoras y Tienda</h2>
        <button class="close-submenu" onclick="closeSubmenu('upgrades')">×</button>
      </div>
      <div class="char-banner">
        <div class="char-avatar">
          <img src="https://i.postimg.cc/mDckn5P0/image-9ac8780f-2.jpg" alt="Muzan Kibutsuji">
        </div>
        <div class="char-info">
          <h4>Muzan Kibutsuji</h4>
          <p>"Todo tiene un precio, humano asqueroso"</p>
        </div>
      </div>
      <div class="tab-buttons">
        <button class="tab-btn active" data-subtab="upgrades-tab">🔧 Mejoras</button>
        <button class="tab-btn" data-subtab="vip-tab">👑 VIP</button>
      </div>
      <div class="tab-content active" id="upgrades-tab">
        <div class="item-card">
          <div class="item-info">
            <h5>⛏️ Pico de Minero Lv. <span id="pick-level">1</span></h5>
            <p>+0.002 ANIM/seg (Máx: 50)</p>
          </div>
          <div class="price-val" id="pick-cost">50 ANIM</div>
          <button class="buy-btn" id="buy-pick">Comprar</button>
        </div>
        <div class="item-card">
          <div class="item-info">
            <h5>🔋 Energía Máx Lv. <span id="energy-level">1</span></h5>
            <p>+20 energía máxima</p>
          </div>
          <div class="price-val" id="energy-cost">80 ANIM</div>
          <button class="buy-btn" id="buy-energy">Comprar</button>
        </div>
        <div class="item-card">
          <div class="item-info">
            <h5>🎯 Suerte Minera Lv. <span id="luck-level">1</span></h5>
            <p>+10% bonus al recolectar</p>
          </div>
          <div class="price-val" id="luck-cost">120 ANIM</div>
          <button class="buy-btn" id="buy-luck">Comprar</button>
        </div>
      </div>
      <div class="tab-content" id="vip-tab">
        <div class="item-card">
          <div class="item-info">
            <h5>🥈 VIP Estándar</h5>
            <p>+30% minería, sin anuncios</p>
          </div>
          <div class="price-val">0.8 TON</div>
          <button class="buy-btn">Adquirir</button>
        </div>
        <div class="item-card">
          <div class="item-info">
            <h5>👑 VIP Premium</h5>
            <p>+60% minería, 0% comisión</p>
          </div>
          <div class="price-val">2.5 TON</div>
          <button class="buy-btn">Adquirir</button>
        </div>
      </div>
    </div>
  </div>
  
  <!-- 👥 AMIGOS/REFERIDOS — Los Pilares -->
  <div class="submenu-modal" id="submenu-friends">
        <div class="submenu-content">
      <div class="submenu-header">
        <h2>👥 Sistema de Referidos</h2>
        <button class="close-submenu" onclick="closeSubmenu('friends')">×</button>
      </div>
      <div class="char-banner">
        <div class="char-avatar">
          <img src="https://i.postimg.cc/MKBRHvpJ/Screenshot-20260906-210320.jpg" alt="Los Pilares">
        </div>
        <div class="char-info">
          <h4>Los Pilares</h4>
          <p>"Nada es imposible con los amigos"</p>
        </div>
      </div>
      <div class="referral-box">
        <h4>🔗 Tu enlace de invitación</h4>
        <div class="referral-link">
          <input type="text" class="ref-input" id="ref-link" readonly>
          <button class="copy-btn" onclick="copyRefLink()">Copiar</button>
        </div>
        <p style="margin-top:10px;font-size:12px;color:var(--dim)">+50 ANIM para ti +20 ANIM para tu amigo</p>
      </div>
      <div class="referral-box">
        <h4>📊 Estadísticas</h4>
        <div class="stat-row"><span>Invitados</span><span id="ref-count">0</span></div>
        <div class="stat-row"><span>Recompensas</span><span id="ref-rewards">0 ANIM</span></div>
      </div>
      <h4 style="margin:18px 0 10px">📋 Referidos recientes</h4>
      <div id="friends-list">
        <p style="color:var(--dim);text-align:center;padding:20px">Aún no tienes referidos</p>
      </div>
    </div>
  </div>

  <!-- 💼 BILLETERA — Tanjiro & Nezuko -->
  <div class="submenu-modal" id="submenu-wallet">
    <div class="submenu-content">
      <div class="submenu-header">
        <h2>💼 Billetera</h2>
        <button class="close-submenu" onclick="closeSubmenu('wallet')">×</button>
      </div>
      <div class="char-banner">
        <div class="char-avatar">
          <img src="https://i.postimg.cc/PxLJ7RLs/image-eede4039-2.jpg" alt="Tanjiro & Nezuko">
        </div>
        <div class="char-info">
          <h4>Tanjiro & Nezuko</h4>
          <p>"Guarda tus tesoros con sabiduría..."</p>
        </div>
      </div>
      <div class="item-card">
        <div class="item-info"><h5>🪙 ANIM</h5><p>Saldo disponible</p></div>
        <div class="price-val" id="wallet-anim">0.000</div>
      </div>
      <div class="item-card">
        <div class="item-info"><h5>💎 TON</h5><p>Equivalente estimado</p></div>
        <div class="price-val" id="wallet-ton">0.000</div>
      </div>
      <div class="wallet-address" id="wallet-address-display">
        📌 Conecta tu billetera TON para retirar
      </div>
      <button class="buy-btn" style="margin-bottom:16px" id="connect-wallet-btn">🔗 Conectar Billetera TON</button>
      <div class="convert-section">
        <h4>💱 Convertir ANIM → TON</h4>
        <p style="font-size:12px;color:var(--dim);margin:6px 0">Tasa: 10,000 ANIM = 1 TON | Comisión 5% | Mínimo 5,000 ANIM</p>
        <input type="number" class="convert-input" id="convert-amount" placeholder="Cantidad de ANIM" min="5000" step="1000">
        <div class="stat-row"><span>Recibirás aprox:</span><span id="convert-result">0.000 TON</span></div>
        <button class="convert-btn" id="convert-btn">Convertir y Retirar</button>
      </div>
      <h4 style="margin:20px 0 10px">📜 Historial</h4>
      <div id="wallet-history">
        <p style="color:var(--dim);text-align:center;padding:20px">Sin movimientos aún</p>
      </div>
    </div>
  </div>

  <!-- 🎁 RECOMPENSAS — Hermanos Tsugikuni -->
  <div class="submenu-modal" id="submenu-rewards">
    <div class="submenu-content">
      <div class="submenu-header">

<!-- 📦 FIREBASE MODULAR — Tu configuración exacta -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAnvFkbl7tS8wtOD0Dewg5zHj_q3zlPcgs",
    authDomain: "anime-mining-tlg.firebaseapp.com",
    projectId: "anime-mining-tlg",
    storageBucket: "anime-mining-tlg.firebasestorage.app",
    messagingSenderId: "443143848384",
    appId: "1:443143848384:web:c925cd8754f8094bef4825"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Exponer para uso global
  window.firebaseDB = { db, doc, setDoc, getDoc, increment };
</script>

<script>
// 🔊 CONTROL DE SONIDO
let soundEnabled = false; // Apagado por defecto
const bgMusic = document.getElementById('bgMusic');
const soundToggle = document.getElementById('soundToggle');

bgMusic.volume = 0.12; // Volumen tenue y tenebroso

function toggleSound(){
  soundEnabled = !soundEnabled;
  if(soundEnabled){
    bgMusic.play().catch(e=>console.log("Reproducción bloqueada por navegador"));
    soundToggle.textContent = '🔊';
    showToast('🔊 Sonido activado');
  } else {
    bgMusic.pause();
    soundToggle.textContent = '🔇';
    showToast('🔇 Sonido desactivado');
  }
}

// 🔊 Sonido al recolectar
function playCollectSound(){
  if(!soundEnabled) return;
  const a = new AudioContext();
  const o = a.createOscillator();
  const g = a.createGain();
  o.connect(g); g.connect(a.destination);
  o.frequency.value = 440; o.type = 'triangle';
  g.gain.setValueAtTime(0.1, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, a.currentTime+0.3);
  o.start(a.currentTime); o.stop(a.currentTime+0.3);
}

// ESTADO DEL JUEGO
let state = {
  userId: null,
  username: 'Usuario',
  firstName: 'Minero',
  balance: 0,
  pending: 0,
  totalMined: 0,
  miningRate: 0.001,
  energy: 100,
  maxEnergy: 100,
  level: 1,
  xp: 0,
  xpToNext: 100,
  pickaxeLevel: 1,
    energyLevel: 1,
  luckLevel: 1,
  vip: null,
  dailyClaimed: false,
  lastDaily: null,
  referrals: 0,
  referralRewards: 0,
  referredBy: null,
  lang: 'es',
  refLink: ''
};

const urlParams = new URLSearchParams(window.location.search);
const refFromUrl = urlParams.get('ref');

function getUserId(){
  let uid = localStorage.getItem('firebaseUserId');
  if(!uid){
    uid = 'user_' + Math.random().toString(36).substr(2, 12);
    localStorage.setItem('firebaseUserId', uid);
  }
  return uid;
}

// 📱 TELEGRAM
if(window.Telegram && window.Telegram.WebApp){
  const tg = window.Telegram.WebApp;
  tg.ready();
  if(tg.initDataUnsafe?.user){
    const user = tg.initDataUnsafe.user;
    state.username = user.username || 'Usuario';
    state.firstName = user.first_name || 'Minero';
  }
}

state.userId = getUserId();
state.refLink = 'https://alexlamvpro.github.io/Anime-miningtelegram/?ref=' + state.userId;
document.getElementById('ref-link').value = state.refLink;

// 💾 CARGAR / GUARDAR DATOS
async function saveUserData(){
  if(!window.firebaseDB) {
    localStorage.setItem('animeMiningState', JSON.stringify(state));
    return;
  }
  try {
    const { db, doc, setDoc } = window.firebaseDB;
    await setDoc(doc(db, 'users', state.userId), state, { merge: true });
    localStorage.setItem('animeMiningState', JSON.stringify(state));
  } catch(e){
    console.error('Guardando error:', e);
    localStorage.setItem('animeMiningState', JSON.stringify(state));
  }
}

async function loadUserData(){
  const saved = localStorage.getItem('animeMiningState');
  if(saved) state = {...state, ...JSON.parse(saved)};

  if(!window.firebaseDB) {
    updateUI();
    return;
  }

  try {
    const { db, doc, getDoc, increment } = window.firebaseDB;
    const docRef = doc(db, 'users', state.userId);
    const docSnap = await getDoc(docRef);
    
    if(docSnap.exists()){
      state = {...state, ...docSnap.data()};
      console.log('✅ Datos cargados de la nube');
    } else {
      if(refFromUrl && refFromUrl !== state.userId){
        state.referredBy = refFromUrl;
        try {
          await setDoc(doc(db, 'users', refFromUrl), {
            referrals: increment(1),
            referralRewards: increment(50)
          }, { merge: true });
        } catch(e){}
        showToast('🎉 ¡Te uniste con un referido! +20 ANIM de bienvenida');
        state.balance += 20;
      }
      await saveUserData();
      console.log('🆕 Usuario nuevo creado');
    }
  } catch(e){
    console.error('Cargando error:', e);
  }
  updateUI();
}

setInterval(saveUserData, 10000);

// 🖼️ ACTUALIZAR INTERFAZ
function updateUI(){
  document.getElementById('username').textContent = state.firstName || state.username;
  document.getElementById('modal-username').textContent = state.firstName || state.username;
  document.getElementById('token-count').textContent = state.balance.toFixed(3);
  document.getElementById('pending-amount').textContent = state.pending.toFixed(3);
  document.getElementById('accumulated-display').textContent = state.pending.toFixed(3) + ' ANIM';
  document.getElementById('mine-rate').textContent = state.miningRate.toFixed(3);
  document.getElementById('energy-text').textContent = Math.round(state.energy) + ' / ' + state.maxEnergy;
  document.getElementById('energy-bar').style.width = (state.energy / state.maxEnergy * 100) + '%';
  document.getElementById('user-level').textContent = 'Nv. ' + state.level;
  document.getElementById('modal-level').textContent = 'Nv. ' + state.level;
  document.getElementById('level-text').textContent = Math.round(state.xp) + ' / ' + state.xpToNext + ' XP';
  document.getElementById('level-bar').style.width = (state.xp / state.xpToNext * 100) + '%';
  document.getElementById('modal-total').textContent = state.totalMined.toFixed(3) + ' ANIM';
  document.getElementById('wallet-anim').textContent = state.balance.toFixed(3);
  document.getElementById('wallet-ton').textContent = (state.balance / 10000).toFixed(4);
  document.getElementById('ref-count').textContent = state.referrals;
  document.getElementById('ref-rewards').textContent = state.referralRewards.toFixed(3) + ' ANIM';
  
  document.getElementById('pick-level').textContent = state.pickaxeLevel;
  document.getElementById('energy-level').textContent = state.energyLevel;
  document.getElementById('luck-level').textContent = state.luckLevel;
  
  const dailyBtn = document.getElementById('daily-btn');
  if(state.dailyClaimed){
    dailyBtn.disabled = true;
    dailyBtn.textContent = '✓ Reclamado';
    document.getElementById('daily-status').textContent = 'Vuelve mañana';
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

// ⛏️ MINERÍA
setInterval(()=>{
  if(state.energy > 0){
    state.pending += state.miningRate;
    state.energy = Math.max(0, state.energy - 0.05);
    state.xp += 0.02;
    
    if(state.xp >= state.xpToNext){
      state.level++;
      state.xp -= state.xpToNext;
      state.xpToNext = Math.floor(state.xpToNext * 1.3);
      state.balance += state.level * 10;
      state.totalMined += state.level * 10;
      showToast('🎉 ¡Subiste al Nivel ' + state.level + '! +' + (state.level*10) + ' ANIM');
    }
    updateUI();
  }
}, 1000);

// 🔋 Recuperar energía
setInterval(()=>{
  if(state.energy < state.maxEnergy){
    state.energy = Math.min(state.maxEnergy, state.energy + 1);
    updateUI();
  }
}, 3000);

// 🎯 Botón Recolectar
document.getElementById('collect-button').addEventListener('click', ()=>{
  if(state.pending > 0){
    playCollectSound();
    const bonus = 1 + (state.luckLevel - 1) * 0.1;
    const amount = state.pending * bonus;
    state.balance += amount;
    state.totalMined += amount;
    state.pending = 0;
    showToast('✅ ¡Recolectado! +' + amount.toFixed(3) + ' ANIM');
    updateUI();
  }
});

// 🧭 NAVEGACIÓN
document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    if(tab !== 'mine'){
      document.getElementById('submenu-' + tab).classList.add('active');
    }
  });
});

function closeSubmenu(name){
  document.getElementById('submenu-' + name).classList.remove('active');
}

// 👤 PERFIL
function openUserModal(){ document.getElementById('userModal').classList.add('active'); }
function closeUserModal(){ document.getElementById('userModal').classList.remove('active'); }  
  
// 📂 Pestañas de mejoras
document.querySelectorAll('[data-subtab]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('[data-subtab]').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.subtab).classList.add('active');
  });
});

// 📋 Copiar enlace
function copyRefLink(){
  navigator.clipboard.writeText(state.refLink);
  showToast('📋 ¡Enlace copiado!');
}

// 🛒 Comprar mejoras
document.getElementById('buy-pick').addEventListener('click', ()=>{
  const cost = 50 * Math.pow(1.5, state.pickaxeLevel - 1);
  if(state.balance >= cost && state.pickaxeLevel < 50){
    state.balance -= cost;
    state.pickaxeLevel++;
    state.miningRate += 0.002;
    showToast('⛏️ ¡Pico mejorado! Nivel ' + state.pickaxeLevel);
    updateUI();
  } else showToast('Saldo insuficiente o máximo alcanzado');
});

document.getElementById('buy-energy').addEventListener('click', ()=>{
  const cost = 80 * Math.pow(1.5, state.energyLevel - 1);
  if(state.balance >= cost){
    state.balance -= cost;
    state.energyLevel++;
    state.maxEnergy += 20;
    state.energy = Math.min(state.energy + 20, state.maxEnergy);
    showToast('🔋 ¡Energía aumentada!');
    updateUI();
  } else showToast('Saldo insuficiente');
});

document.getElementById('buy-luck').addEventListener('click', ()=>{
  const cost = 120 * Math.pow(1.5, state.luckLevel - 1);
  if(state.balance >= cost){
    state.balance -= cost;
    state.luckLevel++;
    showToast('🎯 ¡Suerte aumentada! +10% bonus');
    updateUI();
  } else showToast('Saldo insuficiente');
});

// 📅 Bono Diario
document.getElementById('daily-btn').addEventListener('click', ()=>{
  if(!state.dailyClaimed){
    state.balance += 50;
    state.totalMined += 50;
    state.dailyClaimed = true;
    state.lastDaily = new Date().toDateString();
    showToast('✅ ¡Bono diario reclamado! +50 ANIM');
    updateUI();
  }
});

// 💰 Conversión ANIM → TON
document.getElementById('convert-amount').addEventListener('input', e=>{
  const amt = parseFloat(e.target.value) || 0;
  const result = amt >= 5000 ? (amt / 10000 * 0.95).toFixed(4) : '0.0000';
  document.getElementById('convert-result').textContent = result + ' TON';
});

document.getElementById('convert-btn').addEventListener('click', ()=>{
  const amt = parseFloat(document.getElementById('convert-amount').value) || 0;
  if(amt < 5000) return showToast('Mínimo 5,000 ANIM');
  if(state.balance < amt) return showToast('Saldo insuficiente');
  state.balance -= amt;
  showToast('✅ Conversión solicitada!');
  updateUI();
});

// ❌ Cerrar modales al tocar fuera
document.querySelectorAll('.submenu-modal, .user-modal').forEach(modal=>{
  modal.addEventListener('click', e=>{
    if(e.target === modal) modal.classList.remove('active');
  });
});

// 🔄 Reset diario si cambió el día
const hoy = new Date().toDateString();
if(state.lastDaily && state.lastDaily !== hoy){
  state.dailyClaimed = false;
}

// 🚀 INICIO
loadUserData();
</script>
</body>
</html>
