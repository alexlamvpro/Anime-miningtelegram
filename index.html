<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Anime Mining</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
<style>
:root{--bg:#0a0b14;--card:rgba(18,20,35,.85);--card-border:rgba(139,92,246,.25);--gold:#f5d76e;--cyan:#00e5ff;--purple:#8b5cf6;--text:#f1f5f9;--dim:#94a3b8;--green:#10b981}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,sans-serif;color:var(--text);background:#0a0b14;min-height:100vh;overflow-x:hidden;background-image:url("https://i.postimg.cc/0Q6j4B6x/1788760988257.jpg");background-size:cover;background-position:center;background-repeat:no-repeat;background-attachment:fixed}
#splash-screen{position:fixed;inset:0;z-index:99999;background:radial-gradient(ellipse at center,#12132a 0%,#06070f 70%);display:flex;align-items:center;justify-content:center;transition:opacity .8s}
.splash-content{text-align:center;width:90%;max-width:380px}
.splash-logo{width:90px;height:90px;margin:0 auto 12px;background:linear-gradient(135deg,#f5d76e,#b8962e);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;color:#0a0b14;box-shadow:0 0 40px rgba(245,215,110,.5)}
.splash-title{font-size:36px;font-weight:900;background:linear-gradient(90deg,#f5d76e,#fff,#f5d76e);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.splash-sub{font-size:13px;letter-spacing:6px;color:var(--dim);margin:6px 0 28px}
.splash-loading{font-size:13px;color:var(--cyan);margin-bottom:10px}
.splash-bar-bg{width:100%;height:10px;background:#1a1b2e;border-radius:20px;overflow:hidden;border:1px solid rgba(245,215,110,.2);margin-bottom:18px}
.splash-bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#00e5ff,#8b5cf6,#f5d76e);border-radius:20px;transition:width .25s;box-shadow:0 0 12px rgba(0,229,255,.6)}
.splash-tip{font-size:11px;color:var(--dim);border:1px solid rgba(245,215,110,.15);padding:10px 14px;border-radius:10px;line-height:1.4}
.splash-footer{margin-top:30px;font-size:10px;color:#64748b;display:flex;justify-content:space-between}
.app{position:relative;z-index:1;max-width:430px;margin:0 auto;min-height:100vh;padding:12px 14px 90px;display:flex;flex-direction:column}
.header{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(90deg,rgba(20,22,40,.9),rgba(30,20,50,.85));border:1px solid rgba(139,92,246,.3);border-radius:18px;padding:10px 14px;margin-bottom:14px;backdrop-filter:blur(12px)}
.header-logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:16px}
.header-logo span{background:linear-gradient(90deg,#f5d76e,#fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-balances{display:flex;gap:10px;align-items:center}
.bal-pill{background:rgba(0,0,0,.4);border-radius:20px;padding:4px 10px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px}
.bal-pill.gold{color:var(--gold)}.bal-pill.gem{color:#a78bfa}
.player-card{background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:12px 14px;margin-bottom:16px;display:flex;align-items:center;gap:12px}
.player-avatar{width:52px;height:52px;border-radius:14px;overflow:hidden;border:2px solid rgba(245,215,110,.4);flex-shrink:0}
.player-avatar img{width:100%;height:100%;object-fit:cover}
.player-info{flex:1}.player-name{font-weight:700;font-size:14px}.player-sub{font-size:11px;color:var(--dim);margin-top:2px}
.breath-meter{height:6px;background:rgba(255,255,255,.08);border-radius:10px;margin-top:6px;overflow:hidden}
.breath-fill{height:100%;background:linear-gradient(90deg,#f59e0b,#f5d76e);border-radius:10px;transition:width .4s}
.mining-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;margin:10px 0 20px}
.orb-container{width:220px;height:220px;position:relative;display:flex;align-items:center;justify-content:center}
.orb{width:180px;height:180px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#1e3a5f,#0c1220 70%);box-shadow:0 0 0 3px rgba(245,215,110,.4),0 0 40px rgba(0,229,255,.3),0 0 80px rgba(139,92,246,.2),inset 0 0 40px rgba(0,229,255,.15);position:relative;overflow:hidden;animation:orbPulse 3s ease-in-out infinite}
.orb::before{content:"";position:absolute;inset:-20%;background:conic-gradient(from 0deg,transparent,#00e5ff,transparent,#f5d76e,transparent);animation:spin 8s linear infinite;opacity:.6}
.orb-inner{position:absolute;inset:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#1a3a5c,#0a1018);display:flex;align-items:center;justify-content:center;z-index:2}
.orb-core{width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,#00e5ff,#0284c7);box-shadow:0 0 30px #00e5ff,0 0 60px rgba(0,229,255,.4);animation:coreGlow 2s ease-in-out infinite}
@keyframes orbPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes coreGlow{0%,100%{box-shadow:0 0 25px #00e5ff,0 0 50px rgba(0,229,255,.3)}50%{box-shadow:0 0 40px #00e5ff,0 0 80px rgba(0,229,255,.5)}}
.mining-status{text-align:center;margin-top:18px}
.mining-status .rate{font-size:22px;font-weight:800;color:var(--gold);text-shadow:0 0 12px rgba(245,215,110,.4)}
.mining-status .sub{font-size:12px;color:var(--dim);margin-top:4px}
.mining-active{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--green);margin-bottom:6px}
.mining-active::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.tap-btn{margin-top:16px;width:100%;max-width:280px;padding:16px;border:none;border-radius:16px;background:linear-gradient(90deg,#f5d76e,#d4a017);color:#0a0b14;font-weight:900;font-size:16px;cursor:pointer;letter-spacing:1px;box-shadow:0 6px 25px rgba(245,215,110,.4);transition:transform .15s;display:flex;align-items:center;justify-content:center;gap:8px}
.tap-btn:active{transform:scale(.96)}
.energy-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:10px 14px;margin-bottom:14px}
.energy-label{font-size:12px;font-weight:600;min-width:60px}
.energy-track{flex:1;height:8px;background:rgba(255,255,255,.08);border-radius:10px;overflow:hidden}
.energy-fill{height:100%;background:linear-gradient(90deg,#10b981,#34d399);border-radius:10px;transition:width .4s}
.energy-text{font-size:11px;color:var(--dim);min-width:50px;text-align:right}
.feed-wrap{background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:12px;margin-bottom:14px}
.feed-title{font-size:11px;letter-spacing:1px;color:var(--dim);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.feed-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:12px;align-items:center}
.feed-item:last-child{border:none}
.feed-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);flex-shrink:0}
.nav-bar{position:fixed;bottom:0;left:0;right:0;max-width:430px;margin:0 auto;background:rgba(12,14,28,.95);border-top:1px solid rgba(139,92,246,.25);backdrop-filter:blur(16px);display:flex;justify-content:space-around;padding:8px 4px 12px;z-index:100}
.nav-btn{background:none;border:none;color:var(--dim);font-size:10px;padding:6px 8px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.nav-btn .n-icon{font-size:20px}.nav-btn.active{color:var(--gold);background:rgba(245,215,110,.1)}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-140px);background:rgba(15,18,35,.95);backdrop-filter:blur(16px);border:1px solid rgba(0,229,255,.3);padding:14px 18px;border-radius:16px;z-index:9999;transition:all .4s cubic-bezier(.34,1.56,.64,1);font-weight:600;max-width:92%;min-width:280px;opacity:0;display:flex;gap:12px;align-items:center;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#00e5ff,#0284c7);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.toast-bar{position:absolute;bottom:0;left:0;height:3px;background:linear-gradient(90deg,#00e5ff,#8b5cf6);border-radius:0 0 16px 16px;animation:toastBar 3s linear forwards}
@keyframes toastBar{from{width:100%}to{width:0%}}
.menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:900;opacity:0;visibility:hidden;transition:.3s}
.menu-overlay.active{opacity:1;visibility:visible}
.side-menu{position:fixed;top:0;left:0;bottom:0;width:300px;max-width:85%;background:linear-gradient(180deg,#12142a,#0a0b14);z-index:910;transform:translateX(-100%);transition:transform .35s;display:flex;flex-direction:column;padding:20px 0;overflow-y:auto;border-right:1px solid rgba(139,92,246,.2)}
.side-menu.active{transform:translateX(0)}
.menu-item{display:flex;align-items:center;gap:14px;padding:14px 20px;color:var(--text);text-decoration:none;font-size:15px;border:none;background:none;width:100%;cursor:pointer;text-align:left}
.menu-divider{height:1px;background:rgba(255,255,255,.06);margin:8px 20px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:950;display:none;align-items:flex-end;justify-content:center}
.modal.active{display:flex}
.modal-sheet{background:linear-gradient(180deg,#15172e,#0c0d1a);width:100%;max-width:450px;max-height:88vh;border-radius:24px 24px 0 0;padding:20px 16px 40px;overflow-y:auto;border-top:2px solid rgba(139,92,246,.35)}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.close-modal{background:none;border:none;color:var(--dim);font-size:28px;cursor:pointer}
.stat-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px}
.item-card{background:rgba(0,0,0,.35);border:1px solid rgba(139,92,246,.15);border-radius:14px;padding:14px;margin-bottom:12px}
.buy-btn,.task-btn,.convert-btn{width:100%;border:none;padding:12px;border-radius:12px;background:linear-gradient(90deg,#8b5cf6,#6d28d9);color:#fff;font-weight:700;cursor:pointer;margin-top:8px;transition:transform .15s}
.buy-btn:active,.task-btn:active{transform:scale(.97)}
.buy-btn:disabled,.task-btn:disabled{background:#333;color:#777}
.price-val{font-weight:700;color:var(--gold);font-size:15px}
.tab-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.tab-btn{padding:10px;border-radius:12px;border:none;background:rgba(255,255,255,.06);color:var(--text);cursor:pointer}
.tab-btn.active{background:linear-gradient(90deg,#8b5cf6,#6d28d9)}
.tab-content{display:none}.tab-content.active{display:block}
.char-banner{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,rgba(30,20,50,.8),rgba(20,30,50,.6));border-radius:16px;padding:14px;margin-bottom:16px;border:1px solid rgba(139,92,246,.25)}
.char-avatar{width:70px;height:70px;min-width:70px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 3px rgba(245,215,110,.35)}
.char-avatar img{width:100%;height:100%;object-fit:cover}
.lang-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.lang-btn{padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#fff;cursor:pointer}
.lang-btn.active{border-color:var(--purple);background:rgba(139,92,246,.2)}
.vip-box{background:rgba(0,0,0,.4);border-radius:14px;padding:14px;margin-top:12px;font-size:13px;line-height:1.5}
.badge-active{background:rgba(16,185,129,.2);color:#10b981;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700}
.badge-expired{background:rgba(239,68,68,.2);color:#ef4444;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700}
.ref-input{flex:1;background:rgba(255,255,255,.08);border:none;border-radius:10px;padding:10px;color:#fff}
.copy-btn{background:linear-gradient(90deg,#8b5cf6,#6d28d9);border:none;color:#fff;padding:10px 14px;border-radius:10px;font-weight:600}
.convert-input{width:100%;background:rgba(255,255,255,.08);border:none;border-radius:10px;padding:12px;color:#fff;font-size:15px;margin:8px 0}
.streak-overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:99998;display:none;align-items:center;justify-content:center;padding:20px}
.streak-overlay.active{display:flex}
.streak-card{background:linear-gradient(180deg,#1a1c35,#0f1020);border:1px solid rgba(245,215,110,.3);border-radius:24px;padding:22px;width:100%;max-width:380px;text-align:center;box-shadow:0 0 50px rgba(139,92,246,.25);animation:popIn .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.streak-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:16px 0}
.streak-day{background:rgba(255,255,255,.05);border-radius:12px;padding:8px 2px;border:1px solid rgba(255,255,255,.08);position:relative}
.streak-day.active{background:linear-gradient(180deg,rgba(245,215,110,.2),rgba(184,150,46,.15));border-color:var(--gold);transform:scale(1.05)}
.streak-day.done{background:linear-gradient(180deg,rgba(16,185,129,.2),rgba(5,150,105,.15));border-color:rgba(16,185,129,.5)}
.streak-day.done::after{content:"✓";position:absolute;top:-6px;right:-6px;background:#10b981;color:#fff;width:18px;height:18px;border-radius:50%;font-size:11px;display:flex;align-items:center;justify-content:center}
.streak-reward{font-size:10px;font-weight:800;color:var(--gold);margin-top:3px}
.offline-card{background:linear-gradient(135deg,#1a1c35,#0f1025);border:1px solid rgba(0,229,255,.3);border-radius:18px;padding:14px;margin-bottom:12px;display:flex;align-items:center;gap:12px;animation:slideDown .5s ease}
@keyframes slideDown{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}
.mining-particle{position:fixed;pointer-events:none;font-weight:900;color:var(--gold);animation:particleUp 800ms ease-out forwards;z-index:9999;text-shadow:0 0 8px rgba(245,215,110,.6)}
@keyframes particleUp{0%{transform:translateY(0) scale(.8);opacity:1}100%{transform:translateY(-90px) scale(1.3);opacity:0}}
.terms-content h3{font-size:14px;color:var(--gold);margin:14px 0 6px}
.terms-content p{font-size:12px;color:var(--dim);line-height:1.5;margin-bottom:8px}
.recharge-btn{width:100%;margin-bottom:12px;padding:12px;border:none;border-radius:12px;background:linear-gradient(90deg,#8b5cf6,#ec4899);color:#fff;font-weight:700;font-size:13px;cursor:pointer;display:none}
.music-btn{position:fixed;top:12px;right:12px;z-index:50;width:40px;height:40px;border-radius:50%;border:1px solid rgba(139,92,246,.4);background:rgba(15,18,35,.8);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(8px)}
</style>
</head>
